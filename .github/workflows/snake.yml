name: Generate Contribution Snake

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate premium snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Adil-Ata
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2300D084&color_dots=%23EBEDF0,%239BE9A8,%2340C463,%2330A14E,%232168E
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2300D084&color_dots=%23161B22,%230E4429,%23006D32,%2326A641,%2339D353

      - name: Publish snake
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
