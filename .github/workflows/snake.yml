name: Generate Snake Animation

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Adil-Ata
outputs: |
  dist/github-contribution-grid-snake.svg?color_snake=%2339D353&color_dots=%23EBEDF0,%239BE9A8,%2340C463,%2330A14E,%232168E
  dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2339D353&color_dots=%23161B22,%230E4429,%23006D32,%2326A641,%2339D353

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
