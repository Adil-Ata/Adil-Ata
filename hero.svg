<svg width="100%" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070A0F"/>
      <stop offset="50%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#090C12"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39D353"/>
      <stop offset="50%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#E3B341"/>
    </linearGradient>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0 L0 0 0 34"
            fill="none"
            stroke="#ffffff"
            stroke-opacity=".025"
            stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="30" fill="url(#grid)"/>

  <text x="70" y="76"
        fill="#8B949E"
        font-family="Consolas, monospace"
        font-size="15"
        font-weight="700"
        letter-spacing="4">
    DIGITAL BUILDER / 2026
  </text>

  <circle cx="1018" cy="70" r="7" fill="#39D353">
    <animate attributeName="opacity"
             values="1;.3;1"
             dur="2s"
             repeatCount="indefinite"/>
  </circle>

  <text x="1035" y="76"
        fill="#8B949E"
        font-family="Consolas, monospace"
        font-size="14"
        font-weight="700"
        letter-spacing="2">
    BUILDING
  </text>

  <text x="70" y="185"
        fill="#F0F6FC"
        font-family="Impact, Haettenschweiler, Arial Narrow Bold, sans-serif"
        font-size="90"
        letter-spacing="3">
    ADIL ATA
  </text>

  <rect x="72" y="208"
        width="420"
        height="5"
        rx="3"
        fill="url(#accent)">
    <animate attributeName="width"
             values="120;420;120"
             dur="5s"
             repeatCount="indefinite"/>
  </rect>

  <text x="72" y="252"
        fill="#C9D1D9"
        font-family="Trebuchet MS, Arial, sans-serif"
        font-size="22"
        font-weight="600">
    Building ideas into digital experiences.
  </text>

  <g transform="translate(72 285)">
    <rect width="125" height="42" rx="21"
          fill="#39D353" fill-opacity=".10"
          stroke="#39D353" stroke-opacity=".45"/>
    <text x="62" y="27"
          text-anchor="middle"
          fill="#39D353"
          font-family="Consolas, monospace"
          font-size="14"
          font-weight="700">
      WEB
    </text>

    <g transform="translate(143 0)">
      <rect width="190" height="42" rx="21"
            fill="#00D4FF" fill-opacity=".09"
            stroke="#00D4FF" stroke-opacity=".40"/>
      <text x="95" y="27"
            text-anchor="middle"
            fill="#58D8FF"
            font-family="Consolas, monospace"
            font-size="14"
            font-weight="700">
        E-COMMERCE
      </text>
    </g>

    <g transform="translate(351 0)">
      <rect width="180" height="42" rx="21"
            fill="#E3B341" fill-opacity=".09"
            stroke="#E3B341" stroke-opacity=".40"/>
      <text x="90" y="27"
            text-anchor="middle"
            fill="#E3B341"
            font-family="Consolas, monospace"
            font-size="14"
            font-weight="700">
        AI BUILDS
      </text>
    </g>
  </g>

  <g transform="translate(790 105)">
    <rect width="320" height="170" rx="24"
          fill="#ffffff" fill-opacity=".025"
          stroke="#ffffff" stroke-opacity=".07"/>

    <text x="30" y="45"
          fill="#8B949E"
          font-family="Consolas, monospace"
          font-size="15">
      CURRENT MODE
    </text>

    <text x="30" y="88"
          fill="#F0F6FC"
          font-family="Impact, Arial Black, sans-serif"
          font-size="30"
          letter-spacing="1">
      CREATE → SHIP
    </text>

    <text x="30" y="123"
          fill="#8B949E"
          font-family="Trebuchet MS, Arial, sans-serif"
          font-size="15">
      web • commerce • ai
    </text>

    <rect x="30" y="145"
          width="260"
          height="3"
          rx="2"
          fill="#21262D"/>

    <rect x="30" y="145"
          width="170"
          height="3"
          rx="2"
          fill="url(#accent)">
      <animate attributeName="width"
               values="40;260;40"
               dur="5s"
               repeatCount="indefinite"/>
    </rect>
  </g>

</svg>
